name: homelab-homepage

x-common-keys: &common-keys
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  homepage:
    <<: *common-keys
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_IMAGE_TAG:-latest}
    container_name: homepage
    init: true
    entrypoint: ["/bin/sh", "/app/start-stack.sh"]
    command: ["node", "server.js"]
    user: "${PUID:-1000}:${PGID:-1000}"
    cap_drop:
      - ALL
    environment:
      TZ: ${TZ:-Europe/Paris}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-homepage.arr.local,localhost:3002,127.0.0.1:3002}
    volumes:
      - ./config:/app/config-source:ro
      - ../runtime/homepage:/app/config
      - ./config/icons:/app/public/icons:ro
      - ./scripts/merge-services.cjs:/app/merge-services.cjs:ro
      - ./scripts/start.sh:/app/start-stack.sh:ro
    ports:
      - "${WEB_BIND_IP:-0.0.0.0}:${HOMEPAGE_PORT:-3002}:3000"
    networks:
      - observability
      - proxy

networks:
  observability:
    name: infra-observability
    external: true
  proxy:
    name: proxy-network
    external: true
