name: media-music

x-common-keys: &common-keys
  restart: unless-stopped
  dns:
    - ${DNS_PRIMARY:-1.1.1.1}
    - ${DNS_SECONDARY:-1.0.0.1}
  logging:
    driver: json-file
  environment: &music-environment
    PUID: ${PUID:-1000}
    PGID: ${PGID:-1000}
    TZ: ${TZ:-Europe/Paris}
  security_opt:
    - no-new-privileges:true

services:
  lidarr:
    <<: *common-keys
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    post_start:
      - command: ["/bin/bash", "/opt/configure-arr-auth.sh"]
        user: "${PUID:-1000}:${PGID:-1000}"
        environment:
          ARR_AUTH_API_URL: http://127.0.0.1:8686/api/v1/config/host
      - command: ["/bin/bash", "/opt/configure-arr-root.sh"]
        user: "${PUID:-1000}:${PGID:-1000}"
        environment:
          ARR_ROOT_API_URL: http://127.0.0.1:8686/api/v1/rootfolder
          ARR_ROOT_KIND: lidarr
      - command: ["/bin/bash", "/opt/configure-arr-media.sh"]
        user: "${PUID:-1000}:${PGID:-1000}"
        environment:
          ARR_MEDIA_API_URL: http://127.0.0.1:8686/api/v1/config/mediamanagement
    environment:
      <<: *music-environment
      LIDARR__AUTH__METHOD: ${ARR_AUTH_METHOD:-Forms}
      LIDARR__AUTH__REQUIRED: ${ARR_AUTH_REQUIRED:-DisabledForLocalAddresses}
      LIDARR__SERVER__TRUSTEDNETWORKS: ${ARR_TRUSTED_PROXIES:-}
      LIDARR__SERVER__ALLOWEDHOSTS: ${ARR_ALLOWED_HOSTS:-localhost;127.0.0.1;lidarr;lidarr.arr.local}
      ARR_AUTH_USERNAME: ${ARR_AUTH_USERNAME:-}
      ARR_AUTH_PASSWORD: ${ARR_AUTH_PASSWORD:-}
      ARR_ROOT_FOLDER: ${ARR_ROOT_FOLDER:-/music}
      ARR_IMPORT_EXTRA_FILES: "${ARR_IMPORT_EXTRA_FILES:-false}"
      ARR_EXTRA_FILE_EXTENSIONS: ${ARR_EXTRA_FILE_EXTENSIONS:-srt}
    networks:
      - default
      - media-shared

    volumes:
      - ./data/lidarr:/config
      - ../scripts/configure-arr-auth.sh:/opt/configure-arr-auth.sh:ro
      - ../scripts/configure-arr-root.sh:/opt/configure-arr-root.sh:ro
      - ../scripts/configure-arr-media.sh:/opt/configure-arr-media.sh:ro
      - ../scripts/refresh-lidarr-jellyfin.sh:/opt/refresh-lidarr-jellyfin.sh:ro
      - ${SHARED_DOWNLOADS_DIR:-/downloads}:/downloads
      - ${MUSIC_DIR:-/media/music}:${ARR_ROOT_FOLDER:-/music}:rw

    ports:
      - "8686:8686"

  navidrome:
    <<: *common-keys
    image: deluan/navidrome:latest
    container_name: navidrome

    user: "${PUID:-1000}:${PGID:-1000}"

    environment:
      ND_MUSICFOLDER: ${NAVIDROME_ROOT_FOLDER:-/music}
      ND_DATAFOLDER: /data

    volumes:
      - ./data/navidrome:/data
      - ${MUSIC_DIR:-/media/music}:${NAVIDROME_ROOT_FOLDER:-/music}:rw

    ports:
      - "4533:4533"

    cap_drop:
      - ALL

networks:
  media-shared:
    name: media-shared
    external: true
